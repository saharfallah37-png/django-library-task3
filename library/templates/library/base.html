<!DOCTYPE html>
<html lang="fa" dir="rtl">

        content="width=device-width, initial-scale=1"
    >

    <title>{% block title %}کتابخانهٔ من{% endblock %}</title>
</head>

<body>
    <header>
        <h1>کتابخانهٔ من</h1>

        <nav aria-label="منوی اصلی">

    <footer>
        <hr>

            تمرین ۳ — مدیریت کتابخانه با Django و داده‌های نمونه
